[roles]
# Judge must be specified as provider:model pairs, ordered by preference.
# Example: Judge = ollama:llama-4-maverick,nvidia:meta/llama-4-maverick-17b-128e-instruct
Judge = ollama:llama3.2:3b, nvidia:meta/llama-4-maverick-17b-128e-instruct

# Allow the User role to fall back to round-robin if Llama judge isn't available.
User_allow_round_robin = true

[scoring]
# If true, full validation requires a Llama judge; fail-closed if none available.
require_llama_for_judge = true

# Comma-separated provider:model pairs to allow for scoring in the FULL pass.
# If empty, all available models are allowed.
scoring_whitelist = mistral:open-mistral-nemo-2407

[validation]
# Enable lightweight performance monitoring during validation runs (collects CPU/memory/IO samples)
# Use sparingly when debugging long-running tests; default is false.
perf_monitor = false
# Optional: sample interval (ms). If 0, samples are taken only when explicit events are logged.
perf_sample_interval_ms = 0

