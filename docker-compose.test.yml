services:
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate-test
    ports:
      - "8079:8080"  # Map Weaviate API to port 8079 expected by WeaviateManager
    environment:
      - QUERY_DEFAULTS_LIMIT=50
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
    volumes:
      - ./weaviate_data:/var/lib/weaviate
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/v1/.well-known/ready || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 12

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-test
    ports:
      - "8081:8080"  # Expose SearxNG on host port 8081 to avoid conflicts
    environment:
      - SEARXNG_ALLOW_ORIGINS=*
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/ || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 6
